<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Live TV Dashboard</title>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: rgba(255, 255, 255, 0.03);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg-main); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .header { 
            background: #1e293b; 
            padding: 16px 30px; 
            font-size: 20px; 
            font-weight: 600; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 10;
        }
        .header-title { color: #fff; display: flex; align-items: center; gap: 10px;}
        .header-badge { font-size: 11px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); padding: 4px 10px; border-radius: 6px; color: #60a5fa; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 600;}

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { 
            width: 480px; 
            min-width: 480px; 
            max-width: 50%; 
            flex-shrink: 0;
            background: var(--bg-sidebar); 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid var(--border-color); 
            z-index: 5;
        }
        
        .add-channel-box { padding: 20px 24px; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.1); }
        .add-channel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding: 5px 0; }
        .add-channel-header h3 { font-size: 15px; font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 8px; margin: 0; }
        .toggle-icon { font-size: 12px; color: #94a3b8; transition: transform 0.3s ease; }
        
        #addChannelForm { display: none; margin-top: 20px; animation: slideDown 0.2s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        input, select { 
            width: 100%; padding: 12px 14px; margin-bottom: 15px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border-color); 
            color: #fff; border-radius: 6px; outline: none; font-size: 13px; 
            transition: all 0.2s ease; font-weight: 400;
        }
        
        select option { background-color: #0f172a; color: #fff; padding: 10px; }
        input:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); background: rgba(15, 23, 42, 0.9); }
        input::placeholder { color: var(--text-muted); }
        
        .cat-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .cat-group select { margin-bottom: 0; flex: 1; }
        .cat-group input { margin-bottom: 0; flex: 1; display: none; }
        .add-cat-btn { padding: 0 15px; background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 12px; transition: all 0.2s; white-space: nowrap; }
        .add-cat-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        button.add-btn { 
            width: 100%; padding: 12px; background: var(--primary-color); 
            color: #fff; border: none; border-radius: 6px; cursor: pointer; 
            font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        button.add-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .backup-name-tool { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .backup-name-tool label { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        
        .backup-controls { display: flex; gap: 10px; }
        .backup-controls button { 
            flex: 1; padding: 10px; font-size: 12px; font-weight: 500; border-radius: 6px; 
            cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s; 
            background: rgba(255, 255, 255, 0.03); color: #e2e8f0;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-backup:hover { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399; }
        .btn-restore:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); color: #60a5fa; }

        .channel-list-container { flex: 1; overflow-y: auto; padding: 20px 24px; background: var(--bg-main); }
        
        .category-folder { 
            margin-bottom: 10px; background: var(--bg-sidebar); border-radius: 8px; 
            overflow: hidden; border: 1px solid var(--border-color); transition: all 0.2s ease; 
        }
        .category-header { 
            padding: 12px 16px; background: rgba(255,255,255,0.02); color: #e2e8f0; font-weight: 500; font-size: 13px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            user-select: none; transition: background 0.2s; 
        }
        .category-header:hover { background: rgba(255,255,255,0.05); color: #fff;}
        
        .cat-header-right { display: flex; align-items: center; gap: 10px; }
        .cat-count { font-size: 11px; background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }
        .del-folder-btn { background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; transition: 0.2s; }
        .del-folder-btn:hover { color: var(--danger-color); transform: scale(1.1); }

        .category-content { display: none; padding: 10px; background: rgba(0,0,0,0.15); }
        .category-content.open { display: block; animation: slideDown 0.2s ease; }

        .category-folder.drag-over { border-color: var(--primary-color); background: rgba(59, 130, 246, 0.05); }

        .channel-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255,255,255,0.02); padding: 10px 12px; margin-bottom: 6px; 
            border-radius: 6px; transition: all 0.2s; border-left: 3px solid transparent; 
            cursor: grab; border: 1px solid rgba(255,255,255,0.02);
            gap: 8px;
        }
        .channel-item:active { cursor: grabbing; transform: scale(0.99); }
        .channel-item:last-child { margin-bottom: 0; }
        .channel-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
        
        .channel-item.active { background: rgba(59, 130, 246, 0.1); border-left: 3px solid var(--primary-color); border-color: rgba(59, 130, 246, 0.2); }
        .channel-item.active .channel-name { color: #60a5fa; font-weight: 500; }

        .channel-item.drag-over-item {
            border-color: var(--primary-color);
            transform: scale(1.01);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .channel-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; overflow: hidden; }
        .drag-handle { color: rgba(255,255,255,0.2); font-size: 14px; cursor: grab; flex-shrink: 0;}
        
        .channel-name { font-weight: 400; font-size: 13px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .channel-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .channel-actions button { border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 10px; font-weight: 600; text-transform: uppercase; transition: all 0.2s; color: white;}
        .list-play-btn { background: #10b981; }
        .list-play-btn:hover { background: #059669; }
        .edit-btn { background: #475569; }
        .edit-btn:hover { background: #334155; }
        .delete-btn { background: #ef4444; }
        .delete-btn:hover { background: #dc2626; }
        
        .player-section { 
            flex: 1; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            height: 100%; 
            background: var(--bg-main);
        }
        
        .now-playing { 
            width: 100%;
            max-width: 900px; 
            margin-bottom: 20px; 
            font-size: 14px; 
            color: var(--text-muted); 
            text-align: left; 
            font-weight: 400; 
            background: var(--bg-sidebar); 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color);
        }
        .now-playing span { color: #fff; font-weight: 500; margin-left: 5px; }

        .video-container { 
            width: 100%; 
            max-width: 900px; 
            aspect-ratio: 16/9; 
            height: auto;
            max-height: 65vh; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            /* Shield mouse interaction */
            pointer-events: none;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            outline: none; 
            background: #000; 
            object-fit: fill; 
            display: block;
        }

        /* ULTIMATE CSS HACK: Hide Youtube Title & Branding */
        #ytWrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            pointer-events: none;
            overflow: hidden; /* Kaatne ke liye zaroori */
        }
        
        #ytPlayer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            /* 1.25 Zoom karne se Upar ka title aur Niche ka bar dono screen ke baahar chale jate hain */
            transform: translate(-50%, -50%) scale(1.25);
            pointer-events: none;
            border: none;
        }

        .player-controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px; 
            margin-top: 20px;
            background: var(--bg-sidebar); 
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px; 
        }

        .control-btns { display: flex; align-items: center; gap: 15px; }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .ctrl-btn.main-play {
            background: #fff;
            color: #0f172a;
            padding: 8px 24px;
            border: none;
            font-weight: 600;
        }
        .ctrl-btn.main-play:hover { background: #e2e8f0; transform: scale(1.02); }
        
        /* EDIT POPUP MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeInModal 0.2s ease;
        }

        .modal-content {
            background: var(--bg-sidebar);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 400px;
            max-width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 { margin-bottom: 20px; color: #fff; font-weight: 500; font-size: 16px; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }

        .modal-btn {
            flex: 1; padding: 10px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 500; font-size: 13px;
            transition: all 0.2s;
        }
        .modal-cancel { background: rgba(255, 255, 255, 0.05); color: #e2e8f0; border: 1px solid var(--border-color); }
        .modal-cancel:hover { background: rgba(255, 255, 255, 0.1); }
        .modal-save { background: var(--primary-color); color: #fff; }
        .modal-save:hover { background: var(--primary-hover); }

        @keyframes fadeInModal { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 1024px) {
            .sidebar { min-width: 400px; width: 400px; }
        }
        @media (max-width: 768px) {
            .main-container { flex-direction: column-reverse; overflow-y: auto; }
            .player-section { flex: none; height: auto; padding: 15px; }
            .sidebar { max-width: 100%; min-width: 100%; width: auto; border-right: none; border-top: 1px solid var(--border-color); flex: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">HeroSalman1 Is Live</div>
        <span class="header-badge">LIVE TV</span>
    </div>

    <div class="main-container">
        
        <div class="sidebar">
            <div class="add-channel-box">
                <div class="add-channel-header" onclick="toggleAddForm()">
                    <h3>Manage Channels</h3>
                    <span class="toggle-icon" id="formToggleIcon">▼</span>
                </div>
                
                <div id="addChannelForm">
                    <input type="text" id="chName" placeholder="Channel Name (e.g. StarPlus HD)">
                    <input type="url" id="chUrl" placeholder="M3U8 / YouTube Stream / Playlist URL">
                    
                    <div class="cat-group">
                        <select id="chCategory"></select>
                        <input type="text" id="newCategoryInput" placeholder="Enter custom category...">
                        <button class="add-cat-btn" id="catToggleBtn" onclick="toggleCatInput()">New Category</button>
                    </div>

                    <button class="add-btn" onclick="saveChannel()">Save to Database</button>

                    <div class="backup-name-tool">
                        <label>Data Management</label>
                        <div class="backup-controls">
                            <button class="btn-backup" onclick="backupData()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                                Export (tools.json)
                            </button>
                            <button class="btn-restore" onclick="document.getElementById('restoreFile').click()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                                Import (tools.json)
                            </button>
                            <input type="file" id="restoreFile" style="display:none" accept=".json" onchange="restoreData(event)">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="channel-list-container" id="channelList">
                <div style="text-align:center; color:#64748b; margin-top:20px; font-size: 13px;">Initializing Database...</div>
            </div>
        </div>

        <div class="player-section">
            
            <div class="now-playing" id="nowPlayingText">Ready to stream... <span></span></div>

            <div class="video-container" id="videoContainer">
                <video id="tvPlayer" controls autoplay></video>
                <!-- Hack Wrapper for Cropping UI -->
                <div id="ytWrapper">
                    <div id="ytPlayer"></div> <!-- YouTube API generates iframe here -->
                </div>
            </div>
            
            <div class="player-controls-bar">
                <div class="control-btns">
                    <button class="ctrl-btn" onclick="playPrevChannel()">
                        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg> Prev
                    </button>
                    
                    <button class="ctrl-btn main-play" id="pausePlayBtn" onclick="togglePausePlay()">
                        <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> <span id="playPauseText">Pause</span>
                    </button>
                    
                    <button class="ctrl-btn" onclick="playNextChannel()">
                        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg> Next
                    </button>
                    <!-- Custom Fullscreen Button -->
                    <button class="ctrl-btn" onclick="toggleFullScreen()" title="Fullscreen">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg> 
                    </button>
                </div>
            </div>

        </div>

    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Edit Channel Details</h3>
            <input type="text" id="editChName" placeholder="Update Channel Name">
            <input type="url" id="editChUrl" placeholder="Update M3U8 Stream URL">
            <div class="modal-actions">
                <button class="modal-btn modal-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn modal-save" onclick="saveEditedChannel()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('tvPlayer');
        const ytWrapper = document.getElementById('ytWrapper'); 
        const nowPlayingText = document.getElementById('nowPlayingText');
        const channelListEl = document.getElementById('channelList');
        const categorySelectEl = document.getElementById('chCategory');
        const newCategoryInputEl = document.getElementById('newCategoryInput');
        const catToggleBtn = document.getElementById('catToggleBtn');
        const addChannelForm = document.getElementById('addChannelForm');
        const formToggleIcon = document.getElementById('formToggleIcon');
        
        const pausePlayBtn = document.getElementById('pausePlayBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const playPauseText = document.getElementById('playPauseText');

        const editModal = document.getElementById('editModal');
        const editChNameInput = document.getElementById('editChName');
        const editChUrlInput = document.getElementById('editChUrl');

        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";
        const playPath = "M8 5v14l11-7z";
        
        let hlsInstance = null;
        let isCustomCat = false; 
        let draggedItemIndex = null; 
        let currentPlayingIndex = -1; 
        let editingIndex = null; 
        
        let openFolders = new Set();
        
        const defaultCategories = ["NEWS", "MOVIES", "KIDS & CARTOON", "MUSIC", "SPORTS", "SERIAL EPISODE", "OTHER"];
        let savedCategories = [];
        let savedChannels = [];

        // YouTube API Variables
        let ytPlayerInstance = null;
        let isYtApiReady = false;
        let isYouTubeMode = false;

        function onYouTubeIframeAPIReady() {
            isYtApiReady = true;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                setPauseIcon();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                setPlayIcon();
            }
        }

        const DB_NAME = "HERO_LIVE_01";
        const STORE_NAME = "tvData";
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        function getDBData(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function putDBData(key, value) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function sortSavedChannels() {
            let playingChannel = currentPlayingIndex !== -1 ? savedChannels[currentPlayingIndex] : null;
            savedChannels.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' }));
            if (playingChannel) {
                currentPlayingIndex = savedChannels.indexOf(playingChannel);
            }
        }

        async function bootApp() {
            try {
                await initDB();
                
                let dbCats = await getDBData('categories');
                let dbChans = await getDBData('channels');

                if (!dbCats && localStorage.getItem('myTvCategories')) dbCats = JSON.parse(localStorage.getItem('myTvCategories'));
                if (!dbChans && localStorage.getItem('myTvChannels')) dbChans = JSON.parse(localStorage.getItem('myTvChannels'));

                savedCategories = dbCats || defaultCategories;
                if(!savedCategories.includes("OTHER")) savedCategories.push("OTHER");

                savedChannels = dbChans || [];
                savedChannels = savedChannels.map(ch => ch.category ? ch : { ...ch, category: "OTHER" });
                
                sortSavedChannels();

                renderCategoryDropdown();
                renderChannels();
            } catch (err) {
                console.error("Database init failed", err);
                channelListEl.innerHTML = '<div style="color:#ef4444; text-align:center; font-size:13px;">Database Error. Please refresh.</div>';
            }
        }
        bootApp();

        function toggleAddForm() {
            if (addChannelForm.style.display === 'none' || addChannelForm.style.display === '') {
                addChannelForm.style.display = 'block';
                formToggleIcon.style.transform = 'rotate(180deg)';
            } else {
                addChannelForm.style.display = 'none';
                formToggleIcon.style.transform = 'rotate(0deg)';
            }
        }

        function renderCategoryDropdown() {
            categorySelectEl.innerHTML = '';
            savedCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                categorySelectEl.appendChild(opt);
            });
        }

        function toggleCatInput() {
            isCustomCat = !isCustomCat;
            if (isCustomCat) {
                categorySelectEl.style.display = 'none';
                newCategoryInputEl.style.display = 'block';
                newCategoryInputEl.focus();
                catToggleBtn.innerHTML = 'Cancel';
                catToggleBtn.style.borderColor = '#ef4444';
                catToggleBtn.style.color = '#ef4444';
            } else {
                categorySelectEl.style.display = 'block';
                newCategoryInputEl.style.display = 'none';
                newCategoryInputEl.value = '';
                catToggleBtn.innerHTML = 'New Category';
                catToggleBtn.style.borderColor = 'var(--border-color)';
                catToggleBtn.style.color = '#e2e8f0';
            }
        }

        async function saveChannel() {
            const name = document.getElementById('chName').value.trim();
            const url = document.getElementById('chUrl').value.trim();
            let finalCategory = "";

            if (!name || !url) {
                alert("Please provide both Channel Name and URL.");
                return;
            }

            const duplicateChannel = savedChannels.find(ch => ch.url === url);
            if (duplicateChannel) {
                alert(`URL is already saved in "${duplicateChannel.name}". Duplicate URL not allowed.`);
                return;
            }

            if (isCustomCat) {
                const newCatValue = newCategoryInputEl.value.trim();
                if (!newCatValue) return alert("Please enter a category name!");
                finalCategory = newCatValue.toUpperCase();
                
                if(!savedCategories.includes(finalCategory)) {
                    savedCategories.push(finalCategory);
                    await putDBData('categories', savedCategories);
                    renderCategoryDropdown();
                }
                toggleCatInput();
                categorySelectEl.value = finalCategory;
            } else {
                finalCategory = categorySelectEl.value;
            }

            savedChannels.push({ name: name, url: url, category: finalCategory });
            sortSavedChannels(); 
            
            await putDBData('channels', savedChannels);
            
            document.getElementById('chName').value = '';
            document.getElementById('chUrl').value = '';
            
            const catId = finalCategory.replace(/\s+/g, '-').toLowerCase();
            openFolders.add(catId); 
            
            renderChannels();
        }

        function editChannel(originalIndex, event) {
            event.stopPropagation();
            editingIndex = originalIndex;
            const channel = savedChannels[originalIndex];
            
            editChNameInput.value = channel.name;
            editChUrlInput.value = channel.url;
            editModal.style.display = 'flex';
        }

        function closeEditModal() {
            editModal.style.display = 'none';
            editingIndex = null;
        }

        async function saveEditedChannel() {
            if (editingIndex === null) return;
            
            const newName = editChNameInput.value.trim();
            const newUrl = editChUrlInput.value.trim();
            
            if (!newName || !newUrl) {
                alert("Please provide both Channel Name and URL.");
                return;
            }

            const duplicateChannel = savedChannels.find((ch, idx) => ch.url === newUrl && idx !== editingIndex);
            if (duplicateChannel) {
                alert(`URL is already saved in "${duplicateChannel.name}".`);
                return;
            }

            savedChannels[editingIndex].name = newName;
            savedChannels[editingIndex].url = newUrl;
            
            sortSavedChannels();
            await putDBData('channels', savedChannels);
            
            if (currentPlayingIndex !== -1 && savedChannels[currentPlayingIndex].url === newUrl) {
                nowPlayingText.innerHTML = `Now Playing: <span>${savedChannels[currentPlayingIndex].name}</span>`;
            }
            
            renderChannels();
            closeEditModal();
        }

        async function deleteChannel(originalIndex, event) {
            event.stopPropagation();
            if(confirm("Delete this channel permanently?")) {
                savedChannels.splice(originalIndex, 1);
                if(currentPlayingIndex === originalIndex) currentPlayingIndex = -1;
                await putDBData('channels', savedChannels);
                renderChannels();
            }
        }

        async function deleteCategory(catName, event) {
            event.stopPropagation();
            if(catName === "OTHER") return alert("System folder 'OTHER' cannot be deleted.");

            if(confirm(`Delete folder "${catName}"?\nAll channels inside will be moved to 'OTHER'.`)) {
                savedChannels = savedChannels.map(ch => ch.category === catName ? { ...ch, category: "OTHER" } : ch);
                savedCategories = savedCategories.filter(c => c !== catName);
                
                sortSavedChannels(); 
                await putDBData('channels', savedChannels);
                await putDBData('categories', savedCategories);

                renderCategoryDropdown();
                renderChannels();
            }
        }

        function dragStart(event, index) {
            draggedItemIndex = index;
            event.target.style.opacity = "0.4";
            event.dataTransfer.effectAllowed = 'move';
        }
        function dragEnd(event) { event.target.style.opacity = "1"; }
        function dragOver(event) { event.preventDefault(); event.currentTarget.classList.add('drag-over'); }
        function dragLeave(event) { event.currentTarget.classList.remove('drag-over'); }

        async function dropChannel(event, targetCategory) {
            event.preventDefault();
            event.currentTarget.classList.remove('drag-over');

            if (draggedItemIndex !== null) {
                if (savedChannels[draggedItemIndex].category !== targetCategory) {
                    savedChannels[draggedItemIndex].category = targetCategory;
                    
                    sortSavedChannels();
                    await putDBData('channels', savedChannels);
                    
                    const catId = targetCategory.replace(/\s+/g, '-').toLowerCase();
                    openFolders.add(catId);
                    
                    renderChannels();
                }
                draggedItemIndex = null;
            }
        }

        function dragOverItem(event) {
            event.preventDefault();
            event.stopPropagation(); 
            event.currentTarget.classList.add('drag-over-item');
        }

        function dragLeaveItem(event) {
            event.currentTarget.classList.remove('drag-over-item');
        }

        async function dropOnItem(event, targetIndex) {
            event.preventDefault();
            event.stopPropagation(); 
            event.currentTarget.classList.remove('drag-over-item');

            if (draggedItemIndex !== null && draggedItemIndex !== targetIndex) {
                const targetCategory = savedChannels[targetIndex].category;
                savedChannels[draggedItemIndex].category = targetCategory;
                
                sortSavedChannels();
                
                await putDBData('channels', savedChannels);
                
                const catId = targetCategory.replace(/\s+/g, '-').toLowerCase();
                openFolders.add(catId);

                draggedItemIndex = null;
                renderChannels();
            }
        }

        function toggleFolder(catId) {
            const content = document.getElementById('folder-' + catId);
            const icon = document.getElementById('icon-' + catId);
            if(content.classList.contains('open')) {
                content.classList.remove('open');
                icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
                openFolders.delete(catId);
            } else {
                content.classList.add('open');
                icon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>';
                openFolders.add(catId);
            }
        }

        function renderChannels() {
            channelListEl.innerHTML = '';
            
            if (savedChannels.length === 0 && savedCategories.length === 1 && savedCategories[0] === "OTHER") {
                channelListEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:30px; font-size:13px; font-weight: 400;">Playlist is empty. Add a channel to start streaming.</div>';
                return;
            }

            const groupedChannels = {};
            savedCategories.forEach(cat => groupedChannels[cat] = []);
            
            savedChannels.forEach((ch, index) => {
                const cat = groupedChannels[ch.category] ? ch.category : "OTHER";
                groupedChannels[cat].push({ ...ch, originalIndex: index });
            });

            for(const cat in groupedChannels) {
                if(groupedChannels[cat].length === 0 && cat === "OTHER") continue; 

                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                const isFolderOpen = openFolders.has(catId);
                
                const folder = document.createElement('div');
                folder.className = 'category-folder';
                
                folder.setAttribute('ondragover', 'dragOver(event)');
                folder.setAttribute('ondragleave', 'dragLeave(event)');
                folder.setAttribute('ondrop', `dropChannel(event, '${cat}')`);
                
                const deleteBtnHtml = cat !== "OTHER" ? `<button class="del-folder-btn" onclick="deleteCategory('${cat}', event)" title="Delete Folder">✕</button>` : '';
                
                const folderIconSVG = isFolderOpen 
                    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>'
                    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';

                folder.innerHTML = `
                    <div class="category-header" onclick="toggleFolder('${catId}')">
                        <span style="display:flex; align-items:center; gap:8px;">
                            <span id="icon-${catId}" style="display:flex;">${folderIconSVG}</span> ${cat}
                        </span>
                        <div class="cat-header-right">
                            <span class="cat-count">${groupedChannels[cat].length}</span>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                    <div class="category-content ${isFolderOpen ? 'open' : ''}" id="folder-${catId}"></div>
                `;
                channelListEl.appendChild(folder);

                const contentEl = folder.querySelector('.category-content');

                groupedChannels[cat].forEach(ch => {
                    const item = document.createElement('div');
                    item.className = 'channel-item';
                    item.setAttribute('data-index', ch.originalIndex); 
                    if (ch.originalIndex === currentPlayingIndex) item.classList.add('active');
                    
                    item.setAttribute('draggable', 'true');
                    item.setAttribute('ondragstart', `dragStart(event, ${ch.originalIndex})`);
                    item.setAttribute('ondragend', `dragEnd(event)`);
                    item.setAttribute('ondragover', `dragOverItem(event)`);
                    item.setAttribute('ondragleave', `dragLeaveItem(event)`);
                    item.setAttribute('ondrop', `dropOnItem(event, ${ch.originalIndex})`);

                    item.innerHTML = `
                        <div class="channel-info" title="${ch.name}">
                            <span class="drag-handle">⠿</span>
                            <span class="channel-name">${ch.name}</span>
                        </div>
                        <div class="channel-actions">
                            <button class="list-play-btn play-btn" onclick="playChannelByIndex(${ch.originalIndex}, event)">Play</button>
                            <button class="edit-btn" onclick="editChannel(${ch.originalIndex}, event)">Edit</button>
                            <button class="delete-btn" onclick="deleteChannel(${ch.originalIndex}, event)">Del</button>
                        </div>
                    `;
                    contentEl.appendChild(item);
                });
            }
        }

        function playChannelByIndex(index, event) {
            if(event) event.stopPropagation();
            if(index < 0 || index >= savedChannels.length) return;
            
            currentPlayingIndex = index;
            const ch = savedChannels[index];
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.channel-item[data-index="${index}"]`);
            if(activeItem) activeItem.classList.add('active');
            
            const catId = ch.category.replace(/\s+/g, '-').toLowerCase();
            const folderContent = document.getElementById('folder-' + catId);
            const folderIcon = document.getElementById('icon-' + catId);
            if (folderContent && !folderContent.classList.contains('open')) {
                folderContent.classList.add('open');
                folderIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14l3 3 3-3"/></svg>';
                openFolders.add(catId);
            }

            playStream(ch.url, ch.name);
        }

        function getYouTubeInfo(url) {
            let videoId = null;
            let playlistId = null;
            let vMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/);
            if (vMatch && vMatch[1]) videoId = vMatch[1];
            let pMatch = url.match(/[?&]list=([\w-]+)/);
            if (pMatch && pMatch[1]) playlistId = pMatch[1];
            return { videoId, playlistId };
        }

        function playStream(url, name) {
            nowPlayingText.innerHTML = `Now Playing: <span>${name}</span>`;

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            const ytInfo = getYouTubeInfo(url);
            
            if (ytInfo.videoId || ytInfo.playlistId) {
                isYouTubeMode = true;
                video.style.display = 'none';
                video.pause();
                ytWrapper.style.display = 'block';
                
                let playerVars = {
                    'autoplay': 1,
                    'controls': 0, 
                    'modestbranding': 1,
                    'rel': 0, 
                    'disablekb': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'playsinline': 1
                };
                
                if (ytInfo.playlistId) {
                    playerVars.listType = 'playlist';
                    playerVars.list = ytInfo.playlistId;
                }

                if (!ytPlayerInstance) {
                    if (isYtApiReady) {
                        ytPlayerInstance = new YT.Player('ytPlayer', {
                            width: '100%',
                            height: '100%',
                            videoId: ytInfo.videoId || '',
                            playerVars: playerVars,
                            events: {
                                'onStateChange': onPlayerStateChange
                            }
                        });
                    } else {
                        setTimeout(() => playStream(url, name), 500);
                        return;
                    }
                } else {
                    if (ytInfo.playlistId) {
                        ytPlayerInstance.loadPlaylist({list: ytInfo.playlistId});
                    } else {
                        ytPlayerInstance.loadVideoById(ytInfo.videoId);
                    }
                }
                setPauseIcon();
                return;
            }

            // Normal M3U8 or MP4
            isYouTubeMode = false;
            ytWrapper.style.display = 'none';
            if (ytPlayerInstance && typeof ytPlayerInstance.pauseVideo === 'function') {
                ytPlayerInstance.pauseVideo();
            }
            
            video.style.display = 'block';

            if (Hls.isSupported() && url.includes('.m3u8')) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log("Auto-play blocked."));
                    setPauseIcon();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play();
                    setPauseIcon();
                });
            } else {
                video.src = url;
                video.play().catch(e => console.log("Direct play blocked or unsupported format."));
                setPauseIcon();
            }
        }

        function setPauseIcon() {
            playPauseIcon.querySelector('path').setAttribute('d', pausePath);
            playPauseText.innerText = "Pause";
        }

        function setPlayIcon() {
            playPauseIcon.querySelector('path').setAttribute('d', playPath);
            playPauseText.innerText = "Play";
        }

        function togglePausePlay() {
            if (savedChannels.length === 0) return;
            if (currentPlayingIndex === -1) {
                playChannelByIndex(0);
                return;
            }

            if (isYouTubeMode && ytPlayerInstance) {
                let state = ytPlayerInstance.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    ytPlayerInstance.pauseVideo();
                    setPlayIcon();
                } else {
                    ytPlayerInstance.playVideo();
                    setPauseIcon();
                }
                return;
            }

            if (video.paused) {
                video.play();
                setPauseIcon();
            } else {
                video.pause();
                setPlayIcon();
            }
        }

        function playNextChannel() {
            if (savedChannels.length === 0) return;
            let nextIndex = currentPlayingIndex + 1;
            if (nextIndex >= savedChannels.length) nextIndex = 0; 
            playChannelByIndex(nextIndex);
        }

        function playPrevChannel() {
            if (savedChannels.length === 0) return;
            let prevIndex = currentPlayingIndex - 1;
            if (prevIndex < 0) prevIndex = savedChannels.length - 1; 
            playChannelByIndex(prevIndex);
        }
        
        function toggleFullScreen() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari */
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) { /* IE11 */
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        async function backupData() {
            try {
                const blob = new Blob([JSON.stringify(savedChannels, null, 2)], {type: "application/json"});
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                
                a.download = "tools.json"; 
                a.click();
            } catch(e) {
                alert("Backup creation failed.");
            }
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (Array.isArray(data)) {
                        savedChannels = data.map(ch => ({
                            name: ch.name || "Unknown Channel",
                            url: ch.url || "",
                            category: ch.category || "OTHER"
                        }));
                        
                        const extractedCats = [...new Set(savedChannels.map(ch => ch.category))];
                        savedCategories = [...new Set([...defaultCategories, ...extractedCats])];
                        if(!savedCategories.includes("OTHER")) savedCategories.push("OTHER");
                    } else {
                        alert("Invalid format! Please upload tools.json file.");
                        return;
                    }

                    currentPlayingIndex = -1;
                    sortSavedChannels(); 
                    
                    await putDBData('categories', savedCategories);
                    await putDBData('channels', savedChannels);
                    
                    renderCategoryDropdown();
                    renderChannels();
                    alert("JSON Database Restored Successfully!");
                } catch (err) {
                    alert("Error reading JSON file.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; 
        }

        video.addEventListener('ended', function() {
            if (savedChannels.length === 0 || currentPlayingIndex === -1) return;

            const currentChannel = savedChannels[currentPlayingIndex];
            const currentCategory = currentChannel.category;

            let nextIndex = -1;
            
            for (let i = currentPlayingIndex + 1; i < savedChannels.length; i++) {
                if (savedChannels[i].category === currentCategory) {
                    nextIndex = i;
                    break;
                }
            }
            
            if (nextIndex === -1) {
                for (let i = 0; i < currentPlayingIndex; i++) {
                    if (savedChannels[i].category === currentCategory) {
                        nextIndex = i;
                        break;
                    }
                }
            }

            if (nextIndex !== -1) {
                playChannelByIndex(nextIndex);
            }
        });

        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowRight':
                    if (isYouTubeMode && ytPlayerInstance) {
                        ytPlayerInstance.seekTo(ytPlayerInstance.getCurrentTime() + 10, true);
                    } else if (video && video.duration) {
                        video.currentTime = Math.min(video.duration, video.currentTime + 10);
                    }
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (isYouTubeMode && ytPlayerInstance) {
                        ytPlayerInstance.seekTo(Math.max(0, ytPlayerInstance.getCurrentTime() - 10), true);
                    } else if (video && video.duration) {
                        video.currentTime = Math.max(0, video.currentTime - 10);
                    }
                    e.preventDefault();
                    break;
                case 'Enter':
                case ' ':
                    togglePausePlay();
                    e.preventDefault();
                    break;
            }
        });
    </script>

</body>
