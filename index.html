<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 25px;
      background: linear-gradient(to right, #00dbde, #fc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .manual-date-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .manual-date-box input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00dbde;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      padding: 12px 8px;
      width: 100%;
      outline: none;
      text-align: center;
    }

    .manual-date-box input::placeholder {
      color: #bbb;
      font-size: 14px;
    }

    button {
      background: linear-gradient(45deg, #00dbde, #fc00ff);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 219, 222, 0.4);
    }

    #result-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .age-block {
      font-size: 30px;
      font-weight: 800;
      color: #00dbde;
      text-shadow: 0 0 10px rgba(0, 219, 222, 0.5);
    }

    .sub-text {
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AGE TRACKER</h2>
    
    <!-- Manual Inputs for DD, MM, YYYY -->
    <div class="manual-date-box">
      <input type="number" id="day" placeholder="DD (01)" min="1" max="31" inputmode="numeric">
      <input type="number" id="month" placeholder="MM (05)" min="1" max="12" inputmode="numeric">
      <input type="number" id="year" placeholder="YYYY (2000)" min="1900" max="2100" inputmode="numeric">
    </div>

    <button id="calculateBtn">CALCULATE AGE</button>

    <div id="result-container">
      <div id="ageDisplay" class="age-block">--</div>
      <div id="statusText" class="sub-text">Enter Date & Tap Calculate</div>
      <div id="liveClock" style="font-size: 20px; margin-top: 10px; color: #fc00ff;"></div>
    </div>
  </div>

  <script>
    let intervalId;

    document.getElementById("calculateBtn").addEventListener("click", function () {
      const d = parseInt(document.getElementById("day").value);
      const m = parseInt(document.getElementById("month").value);
      const y = parseInt(document.getElementById("year").value);

      const statusElement = document.getElementById("statusText");

      if (!d || !m || !y || d < 1 || d > 31 || m < 1 || m > 12 || y < 1900) {
        statusElement.innerText = "Sahi Date, Month aur Year Dalein!";
        statusElement.style.color = "#ff4b5c";
        return;
      }

      // Create valid date object (Month is 0-indexed in JS)
      const dob = new Date(y, m - 1, d);

      if (dob > new Date()) {
        statusElement.innerText = "Future Date Allow Nahi Hai!";
        statusElement.style.color = "#ff4b5c";
        return;
      }

      statusElement.innerText = "ये आपकी Current Age है !! ✅";
      statusElement.style.color = "#00dbde";
      statusElement.style.fontWeight = "bold";

      if (intervalId) clearInterval(intervalId);

      const updateAge = () => {
        const now = new Date();

        let years = now.getFullYear() - dob.getFullYear();
        let months = now.getMonth() - dob.getMonth();
        let days = now.getDate() - dob.getDate();

        if (days < 0) {
          months -= 1;
          days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        }
        if (months < 0) {
          years -= 1;
          months += 12;
        }

        const diff = now - dob;
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("ageDisplay").innerText = `${years}Y ${months}M ${days}D`;
        document.getElementById("liveClock").innerText = 
          `${hours.toString().padStart(2, '0')}h : ${minutes.toString().padStart(2, '0')}m : ${seconds.toString().padStart(2, '0')}s`;
      };

      updateAge();
      intervalId = setInterval(updateAge, 1000);
    });
  </script>
</body>
</html>
