<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      position: relative;
      z-index: 200;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 25px;
      background: linear-gradient(to right, #00dbde, #fc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .manual-date-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .manual-date-box input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #00dbde;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      padding: 12px 8px;
      width: 100%;
      outline: none;
      text-align: center;
    }

    .manual-date-box input::placeholder {
      color: #bbb;
      font-size: 14px;
    }

    /* Remove number spin buttons */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    button {
      background: linear-gradient(45deg, #00dbde, #fc00ff);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 219, 222, 0.4);
    }

    #result-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .age-block {
      font-size: 30px;
      font-weight: 800;
      color: #00dbde;
      text-shadow: 0 0 10px rgba(0, 219, 222, 0.5);
    }

    .sub-text {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 1px;
    }

    /* Made by text styling with animation and hover effect */
    #madeByLink {
      color: #aaa;
      text-decoration: none;
      transition: color 0.3s ease, transform 0.1s ease;
      display: inline-block; /* Required for transform */
      cursor: pointer;
    }

    #madeByLink:hover {
      color: #fff; /* Turns white on hover */
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
    }

    /* Animation class for the 'key press' effect */
    .pressed {
      transform: scale(0.90);
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>AGE TRACKER</h2>
    
    <!-- Manual Inputs for DD, MM, YYYY -->
    <div class="manual-date-box">
      <!-- Auto-focus inputs -->
      <input type="number" id="day" placeholder="DD" min="1" max="31" inputmode="numeric" 
             oninput="if(this.value.length >= 2) document.getElementById('month').focus();">
      
      <input type="number" id="month" placeholder="MM" min="1" max="12" inputmode="numeric"
             oninput="if(this.value.length >= 2) document.getElementById('year').focus();">
             
      <input type="number" id="year" placeholder="YYYY" min="1900" max="2100" inputmode="numeric"
             oninput="if(this.value.length >= 4) document.getElementById('calculateBtn').focus();">
    </div>

    <button id="calculateBtn">CALCULATE AGE</button>

    <div id="result-container">
      <div id="ageDisplay" class="age-block">--</div>
      
      <!-- Updated Made By text with link and animation classes -->
      <div id="statusText" class="sub-text">
          <a href="https://www.instagram.com/herosalman1_929/" target="_blank" id="madeByLink">Made By: @HeroSalman1</a>
      </div>
      
      <div id="liveClock" style="font-size: 20px; margin-top: 10px; color: #fc00ff;"></div>
    </div>
  </div>

  <script>
    // --- "Made By" Click Animation Logic ---
    const madeByLink = document.getElementById('madeByLink');

    madeByLink.addEventListener('mousedown', () => {
        madeByLink.classList.add('pressed');
    });

    madeByLink.addEventListener('mouseup', () => {
        madeByLink.classList.remove('pressed');
    });

    // In case the mouse leaves the element while pressed down
    madeByLink.addEventListener('mouseleave', () => {
        madeByLink.classList.remove('pressed');
    });

    // --- Touch events for mobile ---
    madeByLink.addEventListener('touchstart', () => {
         madeByLink.classList.add('pressed');
    });

    madeByLink.addEventListener('touchend', () => {
        setTimeout(() => {
           madeByLink.classList.remove('pressed');
        }, 150); // slight delay so the user sees the press on mobile
    });
    

    // --- Age Calculator Logic ---
    let intervalId;

    document.getElementById("calculateBtn").addEventListener("click", function () {
      const d = parseInt(document.getElementById("day").value);
      const m = parseInt(document.getElementById("month").value);
      const y = parseInt(document.getElementById("year").value);

      const statusElement = document.getElementById("statusText");

      if (!d || !m || !y || d < 1 || d > 31 || m < 1 || m > 12 || y < 1900) {
        statusElement.innerHTML = "<span style='color: #ff4b5c;'>Sahi Date, Month aur Year Dalein!</span>";
        return;
      }

      const dob = new Date(y, m - 1, d);

      if (dob > new Date()) {
        statusElement.innerHTML = "<span style='color: #ff4b5c;'>Future Date Allow Nahi Hai!</span>";
        return;
      }

      // Restore the "Made by" link after successful calculation
      statusElement.innerHTML = `<a href="https://www.instagram.com/herosalman1_929/" target="_blank" id="madeByLink" style="color: #00dbde; font-weight: bold;">ये आपकी Current Age है !! ✅</a>`;
      
      // Re-attach listeners since innerHTML replaced the element
      const newMadeByLink = document.getElementById('madeByLink');
      newMadeByLink.addEventListener('mousedown', () => newMadeByLink.classList.add('pressed'));
      newMadeByLink.addEventListener('mouseup', () => newMadeByLink.classList.remove('pressed'));
      newMadeByLink.addEventListener('mouseleave', () => newMadeByLink.classList.remove('pressed'));
      newMadeByLink.addEventListener('touchstart', () => newMadeByLink.classList.add('pressed'));
      newMadeByLink.addEventListener('touchend', () => setTimeout(() => newMadeByLink.classList.remove('pressed'), 150));

      if (intervalId) clearInterval(intervalId);

      const updateAge = () => {
        const now = new Date();

        let years = now.getFullYear() - dob.getFullYear();
        let months = now.getMonth() - dob.getMonth();
        let days = now.getDate() - dob.getDate();

        if (days < 0) {
          months -= 1;
          days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        }
        if (months < 0) {
          years -= 1;
          months += 12;
        }

        const diff = now - dob;
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("ageDisplay").innerText = `${years}Y ${months}M ${days}D`;
        document.getElementById("liveClock").innerText = 
          `${hours.toString().padStart(2, '0')}h : ${minutes.toString().padStart(2, '0')}m : ${seconds.toString().padStart(2, '0')}s`;
      };

      updateAge();
      intervalId = setInterval(updateAge, 1000);
    });
  </script>
</body>
</html>
